<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<title>Job Tracker</title>
<style>
  :root {
    --bg:#f4f5f7; --card:#fff; --ink:#1b1f24; --muted:#6b7280; --line:#e3e6ea;
    --brand:#1f6feb; --good:#15803d; --warn:#b45309; --bad:#b91c1c; --stop:#dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --card:#1b2027; --ink:#eef0f3; --muted:#9aa3af; --line:#2c333c; --brand:#5b9bff; --good:#4ade80; --warn:#fbbf24; --bad:#f87171; --stop:#ef4444; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding-bottom:84px; }
  header { padding:14px 16px 6px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  h1 { font-size:22px; margin:0; }
  main { padding:8px 16px; max-width:720px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .tap { cursor:pointer; }
  .row { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .muted { color:var(--muted); font-size:14px; }
  .big { font-size:24px; font-weight:700; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .owed { color:var(--warn); } .paid { color:var(--good); }
  .pill { font-size:12px; font-weight:600; padding:2px 8px; border-radius:99px; background:var(--line); white-space:nowrap; }
  .pill.paid { background:#dcfce7; color:#166534; } .pill.part { background:#fef3c7; color:#92400e; } .pill.unpaid { background:#fee2e2; color:#991b1b; } .pill.live { background:#dbeafe; color:#1e40af; } .pill.nopay { background:var(--line); color:var(--muted); }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:10px 14px; cursor:pointer; }
  button.primary { background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600; }
  button.danger { color:var(--bad); }
  button.small { padding:6px 10px; font-size:14px; }
  button:disabled { opacity:.5; }
  .clock { width:100%; padding:34px 10px; font-size:26px; font-weight:800; border-radius:18px; border:0; color:#fff; background:var(--brand); box-shadow:0 4px 14px rgba(0,0,0,.2); }
  .clock.out { background:var(--stop); }
  .timer { font-size:44px; font-weight:800; text-align:center; font-variant-numeric:tabular-nums; margin:4px 0; }
  label { display:block; font-size:14px; color:var(--muted); margin:10px 0 4px; }
  input, select, textarea { width:100%; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px; }
  textarea { min-height:100px; resize:vertical; }
  nav { position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; border:0; border-radius:0; padding:14px 2px; background:none; color:var(--muted); font-weight:600; font-size:14px; }
  nav button.on { color:var(--brand); }
  .photos { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:8px; }
  .photos .ph { position:relative; aspect-ratio:1; background:var(--line); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted); text-align:center; }
  .photos img { width:100%; height:100%; object-fit:cover; border-radius:8px; cursor:pointer; }
  .photos .x { position:absolute; top:3px; right:3px; background:rgba(0,0,0,.6); color:#fff; border:0; border-radius:50%; width:24px; height:24px; padding:0; font-size:14px; }
  .photos .cloud { position:absolute; bottom:3px; left:3px; background:rgba(0,0,0,.6); color:#fff; border-radius:6px; font-size:11px; padding:1px 5px; }
  .line { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
  .line:first-of-type { border-top:0; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.85); display:flex; align-items:center; justify-content:center; z-index:50; }
  .modal img { max-width:96vw; max-height:92vh; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:96px; background:#222; color:#fff; padding:10px 16px; border-radius:10px; z-index:60; max-width:90vw; }
  .empty { text-align:center; color:var(--muted); padding:30px 10px; }
  h2 { font-size:17px; margin:16px 0 8px; }
  .addbtn { display:inline-block; border-radius:10px; padding:6px 10px; font-size:14px; font-weight:600; background:var(--brand); color:#fff; cursor:pointer; }
  .addr { font-size:19px; font-weight:700; }
  .chips { display:flex; gap:8px; margin:8px 0; }
</style>
</head>
<body>
<header><h1 id="title">Clock</h1><button class="small" id="syncbtn">☁️ Sync</button></header>
<main id="app"></main>
<nav>
  <button data-tab="clock">⏱ Clock</button>
  <button data-tab="jobs">🏠 Jobs</button>
  <button data-tab="pay">💵 Pay</button>
  <button data-tab="settings">⚙️ Settings</button>
</nav>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const money = n => (Number(n)||0).toLocaleString(undefined, {style:"currency", currency:"USD"});
const nowLocal = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,16); };
const todayStr = () => nowLocal().slice(0, 10);
const dayOf = s => (s || "").slice(0, 10);
const fmtDay = s => s ? new Date(s.slice(0,10) + "T12:00:00").toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric", year:"numeric"}) : "No date";
const fmtShort = s => s ? new Date(s.slice(0,10) + "T12:00:00").toLocaleDateString(undefined, {month:"short", day:"numeric"}) : "";
const fmtTime = s => s && s.length > 10 ? new Date(s).toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"}) : "";
const hoursOf = v => v.end ? Math.max(0, (new Date(v.end) - new Date(v.start)) / 36e5) : 0;
const fmtHrs = h => `${Math.floor(h)}h ${String(Math.round((h % 1) * 60)).padStart(2, "0")}m`;
const touch = o => (o.updated = Date.now(), o);
const ABBR = { street:"st", avenue:"ave", road:"rd", drive:"dr", lane:"ln", court:"ct", boulevard:"blvd", place:"pl", circle:"cir", terrace:"ter", highway:"hwy", parkway:"pkwy", north:"n", south:"s", east:"e", west:"w", apartment:"apt", suite:"ste" };
// "12 Oak Street" and "12 oak st." are the same address
const normAddr = a => String(a || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim().split(" ").map(w => ABBR[w] || w).join(" ");
function toast(msg, ms=2600) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), ms); }
function download(name, blob) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }

/* ---------- data model ----------
   sites  = JOBS. One address = one job:  {id,name,address,lat,lng,pay,paidAmount,paidDate,paint,work,done,updated,deleted}
   visits = TIME ENTRIES (one clock-in/out) inside a job: {id,siteId,start,end,notes,updated,deleted}
   photos = photos of a job: {id,siteId,taken,driveId,updated,deleted}  (image bytes live in IndexedDB + Drive)
   Older versions kept pay on each entry and allowed duplicate addresses; cleanup() migrates and merges those. */
const LS = "painterJobs.v2";
let state = { sites: [], visits: [], photos: [], settings: { clientId: "", sheetId: "" } };
function load() {
  try { const s = JSON.parse(localStorage.getItem(LS)); if (s) state = { ...state, ...s, settings: { ...state.settings, ...s.settings } }; } catch {}
  if (cleanup().changed) try { localStorage.setItem(LS, JSON.stringify(state)); } catch {}
}
function save() { cleanup(); try { localStorage.setItem(LS, JSON.stringify(state)); } catch { toast("Could not save — storage is full or blocked"); } queueSync(); }

const idb = new Promise((res, rej) => {
  const r = indexedDB.open("painterJobsPhotos", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("photos", { keyPath: "id" });
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
async function tx(mode, fn) {
  const db = await idb;
  return new Promise((res, rej) => { const t = db.transaction("photos", mode); const out = fn(t.objectStore("photos")); t.oncomplete = () => res(out.result); t.onerror = () => rej(t.error); });
}
const blobPut = (id, blob) => tx("readwrite", s => s.put({ id, blob }));
const blobGet = id => tx("readonly", s => s.get(id));
function resizeImage(file, max=1600) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); c.toBlob(b => b ? res(b) : rej(new Error("resize failed")), "image/jpeg", 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("not an image")); };
    img.src = url;
  });
}

/* ---------- migration + "one address = one job" ---------- */
let redirects = {};
function cleanup() {
  let changed = false; redirects = {};
  // 1. old versions kept pay on each time entry: move it up to the job
  for (const v of state.visits) {
    const hasLegacy = (v.pay !== "" && v.pay != null) || (v.paidAmount !== "" && v.paidAmount != null) || (v.paidDate !== "" && v.paidDate != null);
    if (!hasLegacy) continue;
    const s = state.sites.find(x => x.id === v.siteId);
    if (s) {
      if (!(Number(s.pay) > 0) && Number(v.pay) > 0) s.pay = Number(v.pay);
      if (Number(v.paidAmount) > 0) s.paidAmount = (Number(s.paidAmount) || 0) + Number(v.paidAmount);
      if (v.paidDate && (!s.paidDate || v.paidDate > s.paidDate)) s.paidDate = v.paidDate;
      touch(s);
    }
    v.pay = v.paidAmount = v.paidDate = ""; touch(v); changed = true;
  }
  for (const s of state.sites) {
    if (s.pay === undefined || s.pay === "") s.pay = (s.lastPay !== "" && s.lastPay != null && Number(s.lastPay) > 0) ? Number(s.lastPay) : "";
    if (s.paidAmount === undefined) s.paidAmount = ""; if (s.paidDate === undefined) s.paidDate = "";
    for (const f of ["paint", "work", "done"]) if (s[f] === undefined) s[f] = "";
    if (s.lastPay !== "" && s.lastPay != null) { s.lastPay = ""; touch(s); changed = true; }
  }
  // 2. merge jobs that share an address (oldest id wins, so every phone picks the same one)
  const groups = {};
  for (const s of state.sites.filter(x => !x.deleted)) { const k = normAddr(s.address); if (k) (groups[k] ||= []).push(s); }
  for (const list of Object.values(groups)) {
    if (list.length < 2) continue;
    list.sort((a, b) => a.id.localeCompare(b.id)); const keep = list[0];
    for (const dup of list.slice(1)) {
      state.visits.forEach(v => { if (v.siteId === dup.id) { v.siteId = keep.id; touch(v); } });
      state.photos.forEach(p => { if (p.siteId === dup.id) { p.siteId = keep.id; touch(p); } });
      if (!(Number(keep.pay) > 0) && Number(dup.pay) > 0) keep.pay = dup.pay;
      keep.paidAmount = (Number(keep.paidAmount) || 0) + (Number(dup.paidAmount) || 0) || "";
      if (dup.paidDate && (!keep.paidDate || dup.paidDate > keep.paidDate)) keep.paidDate = dup.paidDate;
      for (const f of ["paint", "work"]) if (dup[f] && dup[f] !== keep[f]) keep[f] = keep[f] ? keep[f] + "\n" + dup[f] : dup[f];
      if (dup.done && !keep.done) keep.done = dup.done;
      if ((keep.lat === "" || keep.lat == null) && dup.lat !== "" && dup.lat != null) { keep.lat = dup.lat; keep.lng = dup.lng; }
      redirects[dup.id] = keep.id; touch(keep); dup.deleted = true; touch(dup); changed = true;
    }
  }
  // 3. photos from older versions hung off an entry
  for (const p of state.photos) if (!p.siteId && p.visitId) {
    const v = state.visits.find(x => x.id === p.visitId); if (v) { p.siteId = v.siteId; p.taken = p.taken || dayOf(v.start); touch(p); changed = true; }
  }
  return { changed };
}

/* ---------- selectors ---------- */
const live = o => !o.deleted;
const jobs = () => state.sites.filter(live);
const jobById = id => state.sites.find(s => s.id === id && live(s));
const entries = () => state.visits.filter(live);
const entriesOf = s => entries().filter(v => v.siteId === s.id).sort((a, b) => a.start.localeCompare(b.start));
const photosOf = s => state.photos.filter(p => live(p) && p.siteId === s.id);
const activeEntry = () => entries().find(v => !v.end);
const addrOf = v => jobById(v.siteId)?.address || "Unknown address";
const paidOf = s => Number(s.paidAmount) || 0;
const owedOf = s => Math.max(0, (Number(s.pay) || 0) - paidOf(s));
const payStatus = s => { const t = Number(s.pay) || 0, p = paidOf(s); return !t ? "nopay" : p >= t ? "paid" : p > 0 ? "part" : "unpaid"; };
const statusLabel = { paid: "Paid", part: "Partly paid", unpaid: "Unpaid", nopay: "No pay set" };
function stats(s) {
  const es = entriesOf(s);
  return { es, hours: es.reduce((a, v) => a + hoursOf(v), 0), days: new Set(es.map(v => dayOf(v.start))).size,
    first: es[0]?.start || "", last: es[es.length - 1]?.start || "", active: es.some(v => !v.end) };
}
function findOrMakeJob(address, lat = "", lng = "") {
  const k = normAddr(address); let s = jobs().find(x => normAddr(x.address) === k);
  if (s) { if ((s.lat === "" || s.lat == null) && lat !== "") { s.lat = lat; s.lng = lng; touch(s); } return s; }
  s = touch({ id: uid(), name: "", address: address.trim(), lat, lng, pay: "", paidAmount: "", paidDate: "", paint: "", work: "", done: "", deleted: false });
  state.sites.push(s); return s;
}

/* ---------- location ---------- */
function getPosition() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error("no geolocation"));
    navigator.geolocation.getCurrentPosition(p => res(p.coords), e => rej(e), { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  });
}
function meters(a, b) {
  const R = 6371000, rad = x => x * Math.PI / 180, dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
async function reverseGeocode(lat, lng) {
  const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&lat=${lat}&lon=${lng}`);
  if (!r.ok) throw new Error("lookup failed");
  const d = await r.json(), a = d.address || {};
  const street = [a.house_number, a.road].filter(Boolean).join(" "), town = a.city || a.town || a.village || a.hamlet || a.suburb || "";
  return [street, town].filter(Boolean).join(", ") || d.display_name || "";
}

/* ---------- clock in / out ---------- */
let busy = false, pending = null, lastOut = null;
async function clockIn() {
  if (busy || activeEntry()) return;
  busy = true; render();
  try {
    const c = await getPosition(), here = { lat: c.latitude, lng: c.longitude };
    const near = jobs().filter(s => s.lat !== "" && s.lat != null).map(s => ({ s, d: meters(here, { lat: +s.lat, lng: +s.lng }) })).sort((a, b) => a.d - b.d)[0];
    if (near && near.d < 300) { busy = false; return startEntry(near.s); } // saved job: its saved address is always used
    let address = ""; try { address = await reverseGeocode(here.lat, here.lng); } catch {}
    const same = address && jobs().find(s => normAddr(s.address) === normAddr(address));
    if (same) { busy = false; return startEntry(same); } // same address as an existing job = same job
    pending = { here, address }; busy = false; render(); // brand-new place: confirm before saving
  } catch (e) {
    toast("Couldn't get your location — pick a job below", 3500);
    busy = false; render("choose");
  }
}
function startEntry(job) {
  if (activeEntry()) return toast("You're already clocked in — clock out first");
  state.visits.push(touch({ id: uid(), siteId: job.id, start: nowLocal(), end: "", notes: "", deleted: false }));
  busy = false; save(); toast("Clocked in at " + job.address); tab = "clock"; openJob = null; openEntry = null; render();
}
function clockOut() {
  const v = activeEntry(); if (!v) return;
  v.end = nowLocal(); touch(v); save(); toast(`Clocked out — ${fmtHrs(hoursOf(v))}`);
  lastOut = v.id; tab = "clock"; openJob = null; openEntry = null; render();
}

/* ---------- navigation ---------- */
let tab = "clock", openJob = null, openEntry = null, q = "", dateQ = "", filterOwed = false, timerHandle = null;
function render(sub) {
  clearInterval(timerHandle);
  if (openJob && redirects[openJob]) openJob = redirects[openJob];
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  $("#title").textContent = { clock: "Clock", jobs: openJob ? (openEntry ? "Time entry" : "Job") : "Jobs", pay: "Pay", settings: "Settings" }[tab];
  const app = $("#app");
  if (tab === "clock") viewClock(app, sub);
  else if (tab === "jobs") openJob ? (openEntry ? viewEntry(app) : viewJob(app)) : viewJobs(app);
  else if (tab === "pay") viewPay(app);
  else viewSettings(app);
  syncLabel();
}
const goJob = id => { tab = "jobs"; openJob = id; openEntry = null; render(); };

/* ---------- Clock tab ---------- */
function viewClock(app, sub) {
  const a = activeEntry();
  if (a) {
    app.innerHTML = `
      <div class="card">
        <div class="muted">Working at</div><div class="addr">📍 ${esc(addrOf(a))}</div>
        <div class="timer" id="timer">0:00:00</div>
        <div class="muted" style="text-align:center">Started ${fmtTime(a.start)}</div>
      </div>
      <button class="clock out" id="out">Clock Out</button>
      <div class="actions"><button class="small primary" id="switch">⇄ Switch to another job</button><button class="small" id="open">Open this job</button><button class="small" id="chg">Wrong job? Change</button></div>
      <div id="choose"></div>`;
    const tick = () => { const s = Math.max(0, Math.floor((Date.now() - new Date(a.start)) / 1000)); const t = $("#timer"); if (t) t.textContent = `${Math.floor(s / 3600)}:${String(Math.floor(s % 3600 / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };
    tick(); timerHandle = setInterval(tick, 1000);
    $("#out").onclick = clockOut;
    $("#open").onclick = () => goJob(a.siteId);
    $("#switch").onclick = () => switchPanel($("#choose"), a);
    $("#chg").onclick = () => chooseJobUI($("#choose"), job => { a.siteId = job.id; touch(a); save(); render(); });
    return;
  }
  const today = entries().filter(v => dayOf(v.start) === todayStr()).sort((x, y) => y.start.localeCompare(x.start));
  const todayHrs = today.reduce((t, v) => t + hoursOf(v), 0);
  const recent = recentJobs(), lo = lastOut && state.visits.find(x => x.id === lastOut && live(x) && x.end);
  const todayJobs = new Set(today.map(v => v.siteId)).size;
  app.innerHTML = `
    ${lo ? `<div class="card"><div>✓ Clocked out of <strong>${esc(addrOf(lo))}</strong></div><div class="muted">${fmtTime(lo.start)} – ${fmtTime(lo.end)} · ${fmtHrs(hoursOf(lo))}</div><div class="actions"><button class="small" id="lo-notes">Add notes</button><button class="small" id="lo-x">Dismiss</button></div></div>` : ""}
    <button class="clock" id="in" ${busy ? "disabled" : ""}>${busy ? "Finding your location…" : "Clock In"}</button>
    <p class="muted" style="text-align:center">Uses your location to find the job. Each address is one job.</p>
    <div id="choose"></div>
    ${recent.length ? `<h2>Back to a job</h2>${recent.map(s => { const st = stats(s); return `<button style="width:100%;text-align:left;margin-bottom:8px" data-job="${s.id}">▶ Clock in at <strong>${esc(s.address)}</strong><div class="muted">${st.days} day${st.days === 1 ? "" : "s"} · ${fmtHrs(st.hours)} so far</div></button>`; }).join("")}` : ""}
    <div class="actions" style="justify-content:center"><button class="small" id="manual">Choose a job or type an address</button></div>
    <h2>Today ${today.length ? `<span class="muted">· ${fmtHrs(todayHrs)} · ${todayJobs} job${todayJobs === 1 ? "" : "s"}</span>` : ""}</h2>
    ${today.length ? today.map(v => `<div class="card tap" data-job-open="${v.siteId}"><div class="row"><strong>${esc(addrOf(v))}</strong><span class="muted">${fmtTime(v.start)} – ${fmtTime(v.end)}</span></div><div class="muted">${fmtHrs(hoursOf(v))}${v.notes ? " · " + esc(v.notes.slice(0, 60)) : ""}</div></div>`).join("") : `<div class="muted">No time logged yet today.</div>`}`;
  $("#in").onclick = clockIn;
  if (lo) { $("#lo-notes").onclick = () => { tab = "jobs"; openJob = lo.siteId; openEntry = lo.id; render(); }; $("#lo-x").onclick = () => { lastOut = null; render(); }; }
  $("#manual").onclick = () => chooseJobUI($("#choose"), startEntry);
  app.querySelectorAll("[data-job]").forEach(b => b.onclick = () => startEntry(jobById(b.dataset.job)));
  app.querySelectorAll("[data-job-open]").forEach(c => c.onclick = () => goJob(c.dataset.jobOpen));
  if (pending) confirmNewJob($("#choose"));
  else if (sub === "choose") chooseJobUI($("#choose"), startEntry);
}
function switchPanel(box, a) {
  const others = recentJobs().filter(s => s.id !== a.siteId);
  box.innerHTML = `<div class="card"><strong>Switch to another job</strong><div class="muted">Clocks you out of ${esc(addrOf(a))} and straight into the next job.</div>
    <div class="actions"><button class="primary small" id="sw-gps">📍 Use my location</button></div>
    ${others.map(s => `<button style="width:100%;text-align:left;margin-top:8px" data-sw="${s.id}">▶ <strong>${esc(s.address)}</strong></button>`).join("")}
    <div class="actions"><button class="small" id="sw-pick">Choose or type an address…</button><button class="small" id="sw-x">Cancel</button></div><div id="sw-choose"></div></div>`;
  const out = () => { a.end = nowLocal(); touch(a); save(); lastOut = a.id; };
  $("#sw-gps").onclick = () => { out(); render(); clockIn(); };
  box.querySelectorAll("[data-sw]").forEach(b => b.onclick = () => { out(); startEntry(jobById(b.dataset.sw)); });
  $("#sw-pick").onclick = () => chooseJobUI($("#sw-choose"), job => { out(); startEntry(job); });
  $("#sw-x").onclick = () => { box.innerHTML = ""; };
}
function recentJobs() {
  const last = {}; entries().forEach(v => { if (!last[v.siteId] || v.start > last[v.siteId]) last[v.siteId] = v.start; });
  return jobs().filter(s => last[s.id]).sort((a, b) => last[b.id].localeCompare(last[a.id])).slice(0, 4);
}
function confirmNewJob(box) {
  const { here, address } = pending;
  box.innerHTML = `<div class="card"><strong>New job</strong><div class="muted">This address becomes the job. Every clock-in at it goes in the same job. Fix the address if it's off.</div>

function chooseJobUI(box, onPick) {
  const list = jobs().sort((a, b) => a.address.localeCompare(b.address));

    ${list.length ? `<label>Saved jobs</label><select id="pk-sel"><option value="">Choose…</option>${list.map(s => `<option value="${s.id}">${esc(s.address)}</option>`).join("")}</select>` : ""}

const urlCache = {};
async function drawPhotos(s) {
  const box = $("#photos"); if (!box) return;
  for (const p of photosOf(s).sort((a, b) => (b.taken || "").localeCompare(a.taken || ""))) {
    const d = document.createElement("div"); d.className = "ph"; box.append(d);
    let rec = await blobGet(p.id);
    if (!rec && p.driveId && tokenValid()) {
      try { const r = await fetch(`https://www.googleapis.com/drive/v3/files/${p.driveId}?alt=media`, { headers: { Authorization: "Bearer " + token } }); if (r.ok) { const blob = await r.blob(); await blobPut(p.id, blob); rec = { blob }; } } catch {}
    }
    if (!rec) { d.textContent = p.driveId ? "☁️ Tap Sync to load" : "Missing"; continue; }
    const url = urlCache[p.id] ||= URL.createObjectURL(rec.blob);
    d.innerHTML = `<img src="${url}" alt="Job photo"><button class="x" aria-label="Remove photo">✕</button><span class="cloud">${p.driveId ? "☁️ " : ""}${fmtShort(p.taken)}</span>`;
    d.querySelector("img").onclick = () => { const m = document.createElement("div"); m.className = "modal"; m.innerHTML = `<img src="${url}" alt="">`; m.onclick = () => m.remove(); document.body.append(m); };
    d.querySelector(".x").onclick = () => { if (!confirm("Remove this photo? (A copy already in Google Drive stays there.)")) return; touch(Object.assign(p, { deleted: true })); save(); render(); };
  }
}

/* ---------- Pay tab ---------- */
function viewPay(app) {
  const js = jobs(), all = entries();
  const total = js.reduce((a, s) => a + (Number(s.pay) || 0), 0), paid = js.reduce((a, s) => a + paidOf(s), 0), owed = js.reduce((a, s) => a + owedOf(s), 0);
  const hrsPaidJobs = js.filter(s => Number(s.pay) > 0).reduce((a, s) => a + stats(s).hours, 0);
  const hrs = all.reduce((a, v) => a + hoursOf(v), 0);
  const unpaid = js.filter(s => owedOf(s) > 0).sort((a, b) => (stats(a).last).localeCompare(stats(b).last));
  const noPrice = js.filter(s => !(Number(s.pay) > 0) && stats(s).es.length);
  const months = {};
  all.forEach(v => { const m = v.start.slice(0, 7), r = months[m] ||= { hrs: 0, jobs: new Set(), got: 0 }; r.hrs += hoursOf(v); r.jobs.add(v.siteId); });
  js.forEach(s => { if (paidOf(s) && s.paidDate) { const m = s.paidDate.slice(0, 7), r = months[m] ||= { hrs: 0, jobs: new Set(), got: 0 }; r.got += paidOf(s); } });
  app.innerHTML = `
    <div class="grid" style="margin-bottom:12px">
      <div class="stat"><div class="muted">Owed to me</div><div class="big owed">${money(owed)}</div></div>

      <div class="stat"><div class="muted">Hours</div><div class="big">${fmtHrs(hrs)}</div></div>
      <div class="stat"><div class="muted">Avg $/hour</div><div class="big">${hrsPaidJobs && total ? money(total / hrsPaidJobs) : "–"}</div></div>
    </div>
    <a href="ledger.html" style="display:block;text-align:center;padding:12px;margin-bottom:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;text-decoration:none;font-weight:600">📒 Open the ledger <span class="muted">· by job, by day, day × job grid</span></a>
    ${noPrice.length ? `<div class="card" style="border-color:var(--warn)"><strong>${noPrice.length} job${noPrice.length > 1 ? "s" : ""} with no pay entered</strong><div class="muted">Open each job and enter what it pays so it counts here.</div></div>` : ""}
    <h2>Waiting on payment</h2>
    ${unpaid.length ? unpaid.map(s => `<div class="card"><div class="row tap" data-job-open="${s.id}"><div><strong>${esc(s.address)}</strong><div class="muted">${stats(s).days} day${stats(s).days === 1 ? "" : "s"} · ${fmtHrs(stats(s).hours)}</div></div><strong class="owed">${money(owedOf(s))}</strong></div>
      <div class="actions"><button class="small primary" data-full="${s.id}">✓ Mark paid in full</button></div></div>`).join("") : `<div class="empty">Nothing owed. 🎉</div>`}
    <h2>By month</h2>
    ${Object.keys(months).sort().reverse().map(m => { const r = months[m]; return `<div class="card"><div class="row"><strong>${new Date(m + "-15").toLocaleDateString(undefined, { month: "long", year: "numeric" })}</strong><span class="muted">${r.jobs.size} job${r.jobs.size === 1 ? "" : "s"} worked · ${fmtHrs(r.hrs)}</span></div>
      <div class="muted">Received this month: <span class="paid">${money(r.got)}</span></div></div>`; }).join("") || `<div class="muted">Nothing yet.</div>`}
    <div class="actions"><button id="csv-jobs">⬇️ Export jobs (CSV)</button><button id="csv-time">⬇️ Export time (CSV)</button></div>`;
  app.querySelectorAll("[data-job-open]").forEach(c => c.onclick = () => goJob(c.dataset.jobOpen));
  app.querySelectorAll("[data-full]").forEach(b => b.onclick = () => { const s = jobById(b.dataset.full); s.paidAmount = Number(s.pay); s.paidDate = todayStr(); touch(s); save(); render(); });

}

/* ---------- Google: sign-in ---------- */
let gisLoaded = null, token = null, tokenExp = 0, lastSync = Number(localStorage.getItem("painterJobs.lastSync")) || 0;
const tokenValid = () => token && Date.now() < tokenExp;
const SCOPE = "https://www.googleapis.com/auth/drive.file";
function loadGIS() {
  return gisLoaded ||= new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client"; s.onload = res; s.onerror = () => { gisLoaded = null; rej(new Error("Can't reach Google (offline?)")); }; document.head.append(s); });
}
async function getToken() {
  if (tokenValid()) return token;
  await loadGIS();
  return new Promise((res, rej) => {
    google.accounts.oauth2.initTokenClient({
      client_id: state.settings.clientId, scope: SCOPE,
      callback: r => r.access_token ? (token = r.access_token, tokenExp = Date.now() + (r.expires_in - 60) * 1000, res(token)) : rej(new Error(r.error || "Sign-in failed")),
      error_callback: e => rej(new Error(e.type || "Sign-in cancelled")),
    }).requestAccessToken();
  });
}
async function gfetch(url, opts = {}) {
  const r = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: "Bearer " + await getToken() } });
  if (!r.ok) { const e = new Error(`Google error ${r.status}`); e.status = r.status; throw e; }
  return r.json();
}
const jsonPost = (url, body) => gfetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

/* ---------- Google: sheet sync ---------- */
// Tab names stay Sites/Visits so existing sheets keep working. Sites = jobs, Visits = time entries.
// "lastPay" (Sites) and pay/paidAmount/paidDate (Visits) are only read, to migrate older data.
const SHEET_NAME = "Painter Job Tracker";
const COLS = {
  Sites: ["id", "address", "lat", "lng", "pay", "paidAmount", "paidDate", "paint", "work", "done", "name", "lastPay", "updated", "deleted"],
  Visits: ["id", "siteId", "address", "start", "end", "hours", "notes", "pay", "paidAmount", "paidDate", "updated", "deleted"],
  Photos: ["id", "siteId", "taken", "driveId", "visitId", "updated", "deleted"],
};
const NUM = new Set(["lat", "lng", "pay", "paidAmount", "lastPay", "updated"]);
const DERIVED = new Set(["hours"]);
function merge(local, remote) {
  const m = new Map(local.map(x => [x.id, x]));
  for (const r of remote) { const l = m.get(r.id); if (!l || (r.updated || 0) > (l.updated || 0)) m.set(r.id, r); }
  return [...m.values()];
}
function toRows(name) {
  const siteAddr = id => state.sites.find(s => s.id === id)?.address || "";
  const src = { Sites: state.sites, Visits: state.visits, Photos: state.photos }[name];
  return [COLS[name]].concat(src.map(o => COLS[name].map(c => c === "deleted" ? (o.deleted ? 1 : "") : c === "address" && name === "Visits" ? siteAddr(o.siteId) : c === "hours" ? (o.end ? +hoursOf(o).toFixed(2) : "") : (o[c] ?? ""))));
}
function fromRows(name, rows) {
  const head = (rows || [])[0] || []; const out = [];
  for (const r of (rows || []).slice(1)) {
    if (!r[head.indexOf("id")]) continue;
    const o = {};
    head.forEach((h, i) => { if (!COLS[name].includes(h) || DERIVED.has(h) || (h === "address" && name === "Visits")) return; const v = r[i] ?? ""; o[h] = h === "deleted" ? (v === 1 || v === "1" || v === "TRUE" || v === true) : NUM.has(h) && v !== "" ? Number(v) : String(v); });
    COLS[name].forEach(c => { if (!DERIVED.has(c) && !(c === "address" && name === "Visits") && !(c in o)) o[c] = c === "deleted" ? false : ""; });
    out.push(o);
  }
  return out;
}
async function ensureFolder(name, parent) {
  const q = `name='${name.replace(/\\/g, "\\\\").replace(/'/g, "\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false${parent ? ` and '${parent}' in parents` : ""}`;
  const f = await gfetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id)`);
  if (f.files.length) return f.files[0].id;
  return (await jsonPost("https://www.googleapis.com/drive/v3/files?fields=id", { name, mimeType: "application/vnd.google-apps.folder", ...(parent ? { parents: [parent] } : {}) })).id;
}
async function findOrCreateSheet() {
  const q = `name='${SHEET_NAME}' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false`;
  const f = await gfetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&orderBy=createdTime&fields=files(id)`);
  if (f.files.length) return f.files[0].id;
  return (await jsonPost("https://sheets.googleapis.com/v4/spreadsheets", { properties: { title: SHEET_NAME }, sheets: Object.keys(COLS).map(t => ({ properties: { title: t } })) })).spreadsheetId;
}
async function uploadPendingPhotos(root) {
  for (const p of state.photos.filter(x => !x.driveId && !x.deleted)) {
    const rec = await blobGet(p.id); if (!rec) continue;
    const job = jobById(p.siteId); if (!job) continue;
    const folder = await ensureFolder(job.address.replace(/[\/\\]/g, "-").slice(0, 100), root);
    const boundary = "b" + uid(), meta = JSON.stringify({ name: `${p.taken || "photo"}-${p.id}.jpg`, parents: [folder] });
    const body = new Blob([`--${boundary}\r\nContent-Type: application/json\r\n\r\n${meta}\r\n--${boundary}\r\nContent-Type: image/jpeg\r\n\r\n`, rec.blob, `\r\n--${boundary}--`]);
    const out = await gfetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", { method: "POST", headers: { "Content-Type": `multipart/related; boundary=${boundary}` }, body });
    p.driveId = out.id; touch(p);
  }
}
let syncing = false, syncTimer = null, syncMsg = "";
function syncLabel() { const b = $("#syncbtn"); if (b) b.textContent = syncing ? "⏳ Syncing…" : state.settings.clientId ? (syncMsg || "☁️ Sync") : "☁️ Set up sync"; }
function queueSync() { if (!state.settings.clientId || !tokenValid()) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow(true), 3000); }
async function syncNow(quiet) {
  if (syncing) return;
  if (!state.settings.clientId) { tab = "settings"; render(); return toast("Add your Google Client ID to turn on sync", 4000); }
  syncing = true; syncMsg = ""; syncLabel();
  try {
    if (!state.settings.sheetId) state.settings.sheetId = await findOrCreateSheet();
    const id = state.settings.sheetId;
    let got;
    try { got = await gfetch(`https://sheets.googleapis.com/v4/spreadsheets/${id}/values:batchGet?${Object.keys(COLS).map(t => "ranges=" + t).join("&")}`); }
    catch (e) { if (e.status === 404 || e.status === 400) { state.settings.sheetId = await findOrCreateSheet(); got = { valueRanges: [] }; } else throw e; }
    const byName = Object.fromEntries((got.valueRanges || []).map(r => [r.range.split("!")[0].replace(/'/g, ""), r.values]));
    state.sites = merge(state.sites, fromRows("Sites", byName.Sites));
    state.visits = merge(state.visits, fromRows("Visits", byName.Visits));
    state.photos = merge(state.photos, fromRows("Photos", byName.Photos));
    cleanup(); // merges duplicate addresses and upgrades older data before it is written back
    await uploadPendingPhotos(await ensureFolder("Painter Jobs"));
    const sid = state.settings.sheetId;
    await jsonPost(`https://sheets.googleapis.com/v4/spreadsheets/${sid}/values:batchClear`, { ranges: Object.keys(COLS) });
    await jsonPost(`https://sheets.googleapis.com/v4/spreadsheets/${sid}/values:batchUpdate`, { valueInputOption: "RAW", data: Object.keys(COLS).map(t => ({ range: `${t}!A1`, values: toRows(t) })) });
    lastSync = Date.now(); localStorage.setItem("painterJobs.lastSync", lastSync);
    localStorage.setItem(LS, JSON.stringify(state));
    if (!quiet) toast("Synced ✓");
    syncMsg = "✓ Synced";
  } catch (e) { syncMsg = "⚠️ Retry sync"; toast("Sync failed: " + e.message, 5000); }
  syncing = false;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) syncLabel(); else render(); // don't wipe what's being typed
}

/* ---------- boot ---------- */
$("#syncbtn").onclick = () => syncNow();
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { tab = b.dataset.tab; if (tab === "jobs") { openJob = null; openEntry = null; } render(); });
load(); render();
if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
</script>
</body>
